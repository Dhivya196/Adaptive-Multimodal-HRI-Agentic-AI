# ==============================================================================
# Adaptive Multimodal HRI Framework - Coordinator Configuration
# ==============================================================================

coordinator:
  # Minimum confidence threshold (below this, marked as LOW_CONFIDENCE)
  min_confidence_threshold: 0.40

  # High confidence threshold for autonomous referential grounding
  high_confidence_threshold: 0.60

  # Ambiguity delta threshold for candidates in the same sector
  ambiguity_threshold: 0.10

  # Whether targets requested by voice must be confirmed by visual perception
  require_visual_target_confirmation: true

  # Modality fusion weights
  voice_weight: 0.55
  vision_weight: 0.35
  gesture_weight: 0.10

  # Logging verbosity
  log_level: "INFO"
