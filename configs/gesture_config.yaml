# Gesture Agent Configuration for Adaptive Multimodal HRI
gesture:
  backend: "hagrid"                    # "hagrid" (primary), "lightweight" (fallback), or "mock"
  model_path: "models/hagrid/yolov10n_hagrid.pt"  # Path to pretrained HaGRID detector
  confidence_threshold: 0.50           # Minimum confidence threshold for gesture detection
  device: "cpu"                        # Compute device ("cpu" for standard machine)
  default_direction: "NONE"            # Fallback direction when not spatially grounded
  enabled_gestures:
    - "STOP"
    - "POINT_LEFT"
    - "POINT_RIGHT"
    - "POINT_FORWARD"
    - "WAVE"
    - "THUMBS_UP"
    - "THUMBS_DOWN"
    - "OK"

camera:
  device_id: 0                      # Camera index (0 for default webcam)
  width: 640                        # Frame width
  height: 480                       # Frame height
  fps: 30                           # Target capture frame rate
